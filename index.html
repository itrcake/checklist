<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐰%3C/text%3E%3C/svg%3E">
  <title>Checklist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <svg class="bunny" id="bunny" aria-hidden="true"></svg>
      <div class="hero-text">
        <h1>Checklist</h1>
        <p id="progress" class="bubble">กำลังโหลด...</p>
      </div>
      <a href="log.html" class="link">ดูประวัติ</a>
    </header>

    <section class="card">
      <form id="add-form" class="add">
        <input id="new-name" placeholder="ตั้งชื่อ checklist ใหม่ เช่น แต่งบ้าน" maxlength="100" aria-label="ชื่อ checklist ใหม่">
        <button type="submit">สร้าง checklist</button>
      </form>
      <p id="status" class="status" role="status"></p>
      <ul id="list" class="list"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="folders.js"></script>
</body>
</html>
