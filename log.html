<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐰%3C/text%3E%3C/svg%3E">
  <title>ประวัติการแก้ไข · Checklist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <a href="index.html" class="crumb">← โฟลเดอร์ทั้งหมด</a>
    <header class="hero">
      <svg class="bunny small" aria-hidden="true"></svg>
      <div class="hero-text">
        <h1>ประวัติการแก้ไข</h1>
        <p class="bubble">ทำอะไรไปบ้าง ดูย้อนหลังได้ที่นี่</p>
      </div>
    </header>

    <section class="card">
      <input id="filter" class="filter" placeholder="ค้นหาตามโฟลเดอร์ checklist หรือรายการ" aria-label="ค้นหาประวัติ">
      <p id="status" class="status" role="status"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>เวลา</th><th>โฟลเดอร์</th><th>Checklist</th><th>ทำอะไร</th><th>รายการ</th><th>รายละเอียด</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    const rowsEl = document.getElementById("rows");
    const filterEl = document.getElementById("filter");
    const fmt = new Intl.DateTimeFormat("th-TH", { dateStyle: "medium", timeStyle: "short" });
    let logs = [];

    function cell(text, cls) {
      const td = document.createElement("td");
      td.textContent = text ?? "";
      if (cls) td.className = cls;
      return td;
    }

    function render() {
      const q = filterEl.value.trim().toLowerCase();
      const shown = logs.filter((l) =>
        !q || [l.folder_name, l.checklist_name, l.item_title, l.action].some((v) => (v || "").toLowerCase().includes(q)));
      rowsEl.replaceChildren();
      if (shown.length === 0) {
        const tr = document.createElement("tr");
        const td = cell(logs.length ? "ไม่พบประวัติที่ตรงกับคำค้น" : "ยังไม่มีประวัติ");
        td.colSpan = 6;
        tr.append(td);
        rowsEl.append(tr);
        return;
      }
      for (const l of shown) {
        const tr = document.createElement("tr");
        tr.append(
          cell(fmt.format(new Date(l.created_at)), "time"),
          cell(l.folder_name || "–"),
          cell(l.checklist_name || "–"),
          cell(l.action),
          cell(l.item_title),
          cell(l.detail, "detail"),
        );
        rowsEl.append(tr);
      }
    }

    async function loadLog() {
      const { data, error } = await db.from("activity_log")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(500);
      if (error) { showStatus("โหลดประวัติไม่สำเร็จ: " + error.message); return; }
      logs = data;
      render();
    }

    filterEl.addEventListener("input", render);
    loadLog();
  </script>
</body>
</html>
